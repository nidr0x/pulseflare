name: Feature request
description: Suggest an improvement for Pulseflare.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Deployment
        - Configuration
        - Monitoring
        - Notifications
        - Public status page
        - Documentation
        - Other
    validations:
      required: true
