name: Deploy Pulseflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULSEFLARE_WORKER_NAME: ${{ vars.PULSEFLARE_WORKER_NAME }}
      PULSEFLARE_D1_NAME: ${{ vars.PULSEFLARE_D1_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: |
          npm run test
          npm run build
          npm run lint

      - name: Resolve Cloudflare resources
        id: resources
        run: node .github/scripts/resolve-cloudflare-resources.mjs

      - name: Render deploy config
        run: |
          cat > apps/worker/wrangler.deploy.toml <<EOF
          name = "${{ steps.resources.outputs.worker_name }}"
          main = "src/index.ts"
          compatibility_date = "2026-04-18"
          compatibility_flags = ["nodejs_compat"]

          [assets]
          directory = "../web/dist"
          binding = "ASSETS"
          run_worker_first = ["/api/*"]
          not_found_handling = "single-page-application"

          [[d1_databases]]
          binding = "PULSEFLARE_D1"
          database_name = "${{ steps.resources.outputs.database_name }}"
          database_id = "${{ steps.resources.outputs.database_id }}"
          EOF

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ${{ steps.resources.outputs.database_name }} --remote --config apps/worker/wrangler.deploy.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config apps/worker/wrangler.deploy.toml
